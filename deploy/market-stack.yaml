# Ol1n Market stack on JODA. Started by `make deploy-db` and `make deploy-nas` from the Mac.
#
# market.ol1n.com: tunnel "market-nas" → Caddy → market-web → market-api.
# No port is published on the host except Postgres on the LAN address (DB_BIND):
# the Mac uses the databases market_dev and market_test there (db-init/); Docker doesn't run on the Mac.
# Ingest reads ugc-api over the ugcfactory_ugc network (the UGC stack must be running).

name: market

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: market-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=market
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=market
    volumes:
      - ${DATA_DIR:?set DATA_DIR in .env}/postgres:/var/lib/postgresql/data
      # only on first start with an empty DB: market_dev + market_test for development from the Mac
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_BIND:-127.0.0.1}:5438:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "market"]
      interval: 10s
      retries: 5
    networks: [market]

  market-api:
    build: ../api
    image: market-api:latest
    container_name: market-api
    restart: unless-stopped
    environment:
      - MARKET_ADDR=:8096
      - DATABASE_URL=postgres://market:${POSTGRES_PASSWORD}@db:5432/market?sslmode=disable
      - MARKET_DATA=/data
      - PUBLIC_URL=${PUBLIC_URL:-https://market.ol1n.com}
      - UGC_URL=http://ugc-api:8095
      - UGC_POLL_INTERVAL=${UGC_POLL_INTERVAL:-5m}
      - DEFAULT_PRICE_CENTS=${DEFAULT_PRICE_CENTS:-300}
      - ADMIN_EMAILS=${ADMIN_EMAILS:?set ADMIN_EMAILS in .env}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-shop}
      - EMBEDDINGS_BASE_URL=${EMBEDDINGS_BASE_URL:-}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-shop-embed}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-Ol1n Market <market@ol1n.com>}
      - COOKIE_SECURE=true
    volumes:
      - ${DATA_DIR}/files:/data
    networks: [market, ugc]
    depends_on:
      db:
        condition: service_healthy

  market-web:
    build: ../web
    image: market-web:latest
    container_name: market-web
    restart: unless-stopped
    environment:
      - API_URL=http://market-api:8096
      - ORIGIN=${PUBLIC_URL:-https://market.ol1n.com}
      # adapter-node: real client IP from Cloudflare
      - ADDRESS_HEADER=CF-Connecting-IP
      - BODY_SIZE_LIMIT=1M
    networks: [market]
    depends_on: [market-api]

  caddy:
    image: caddy:2-alpine
    container_name: market-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [market]
    depends_on: [market-web]

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    container_name: market-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks: [market]
    depends_on: [caddy]

networks:
  market:
  ugc:
    external: true
    name: ugcfactory_ugc
